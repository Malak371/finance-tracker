server {
    listen 80;
    root /usr/share/nginx/html;

    # An add_header inside a location replaces the server-level ones, so each location
    # includes the shared security headers.

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes (/app/expenses, ...) all serve the app shell.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
